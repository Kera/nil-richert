name: Deploy dev
env:
  CURRENT_ENV: develop
  AWS_LOGIN: ${{ secrets.AWS_ACCOUNT_EMAIL }}
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - feature/*
jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package.json') }}
      - name: Install node packages
        run: npm ci
      - name: Run eslint
        id: run-eslint
        run: npm run lint
      - name: Upload lint report
        if: steps.run-eslint.outcome == 'failure'
        run: ls
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package.json') }}
      - name: Install node packages
        run: npm ci
      - name: Run vitest
        run: npm run test
  build-upload:
    runs-on: ubuntu-latest
    needs: unit-test
    outputs:
      commit-id: ${{ github.event.head_commit.id }}
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package.json') }}
      - name: Install node packages
        run: npm ci
      - name: Build app
        run: npm run build
      - name: List files build
        run: ls
      - name: Print infos
        run: echo "${{ toJSON(github.event) }}"
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: nil-richert-fr-build-${{ env.CURRENT_ENV }}-${{ github.event.head_commit.id }}
          path: output
  echo-commit-id:
    runs-on: ubuntu-latest
    needs: build-upload
    steps:
      - name: Display infos
        run: echo "branch - $CURRENT_ENV | commitId - ${{ needs.build-upload.outputs.commit-id }} user - $GITHUB_ACTOR" \
