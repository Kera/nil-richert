name: Deploy dev
env:
  CURRENT_ENV: develop
  AWS_LOGIN: ${{ secrets.AWS_ACCOUNT_EMAIL }}
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - feature/*
jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: ~/node_modules
          key: npm-deps-${{ hashFiles('**/package.json') }}
      - name: Install node packages
        if: steps.cache.cache-hit != 'true'
        run: npm ci
      - name: Run eslint
        id: run-eslint
        run: npm run lint
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: ~/node_modules
          key: npm-deps-${{ hashFiles('**/package.json') }}
      - name: Install node packages
        if: steps.cache.cache-hit != 'true'
        run: npm ci
      - name: Run vitest
        id: vitest
        run: ls && npm run test
      - name: Upload unit test report
        if: ${{ failure() && steps.vitest.conclusion == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: ./vitest-report.json
  build-upload:
    runs-on: ubuntu-latest
    needs: unit-tests
    outputs:
      commit-id: ${{ github.event.head_commit.id }}
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: ~/node_modules
          key: npm-deps-${{ hashFiles('**/package.json') }}
      - name: Install node packages
        if: steps.cache.cache-hit != 'true'
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Print infos
        run: echo "${{ toJSON(github.event) }}"
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: nil-richert-fr-build-${{ env.CURRENT_ENV }}-${{ github.event.head_commit.id }}
          path: output
  echo-commit-id:
    runs-on: ubuntu-latest
    needs: build-upload
    steps:
      - name: Display infos, list file
        run: echo "branch - $CURRENT_ENV | commitId - ${{ needs.build-upload.outputs.commit-id }} user - $GITHUB_ACTOR"
  report:
    runs-on: ubuntu-latest
    needs: ['eslint', 'unit-tests', 'build-upload', 'echo-commit-id']
    if: ${{ always() || success() || cancelled() }}
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: ~/node_modules
          key: npm-deps-${{ hashFiles('**/package.json') }}
      - name: Install node packages
        if: steps.cache.cache-hit != 'true'
        run: npm ci
      - name: Always executed
        run: echo "Job ended, listing files" && ls
  
