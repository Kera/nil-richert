name: Deploy dev
env:
  CURRENT_ENV: develop 
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - feature/*
jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install node packages
        run: npm ci
      - name: Run eslint
        run: npm run lint
  unit-test:
    runs-on: ubuntu-latest
    needs: eslint
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install node packages
        run: npm ci
      - name: Run vitest
        run: npm run test
  build-upload:
    runs-on: ubuntu-latest
    needs: unit-test
    outputs:
      commit-id: ${{steps.commit-id.outputs.commitId}}
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install node packages
        run: npm ci
      - name: Build app
        run: npm run build
      - name: List files build
        run: ls
      - name: Print infos
        run: echo "${{ toJSON(github.event) }}"
      - name: Publish commit id
        id: publish commit-id
#        run: echo "commit-id=$toJSON(github.event.head_commit.id)" >> "$GITHUB_OUTPUT"
#        run: echo "::set-output name=my_output::my_value"
#        run: echo outputContent=nilvalue >> $env:GITHUB_OUTPUT
        run: echo publishing var
        outputs:
          nilValue: publishedVar
      # - name: Display commit Id 1
      #   outputs:
      #     nilValue: ${{ steps.step1.outputs.test }}
      #   run: echo "current env - ${{ steps.commit-id.outputs.outputContent }}"
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: nil-richert-fr-build-${{ github.event.head_commit.id }}
          path: output
  echo-commit-id:
    runs-on: ubuntu-latest
    needs: build-upload
    steps:
      - name: Display commit Id
        run: echo "outputs - ${{ needs.commit-id.outputs.nilValue }}"

       